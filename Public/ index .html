<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Billionaires Empire Marketplace</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #080808;
    color: white;
}

header {
    background: #111;
    padding: 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    border-bottom: 1px solid #b8860b;
}

.logo {
    color: gold;
    font-size: 22px;
    font-weight: bold;
}

nav a {
    color: white;
    text-decoration: none;
    margin: 8px;
    font-size: 14px;
}

nav a:hover {
    color: gold;
}

.hero {
    text-align: center;
    padding: 90px 20px;
    background: linear-gradient(135deg, #000, #29200b);
}

.hero h1 {
    color: gold;
    font-size: 38px;
    margin-bottom: 20px;
}

.hero p {
    font-size: 17px;
    line-height: 1.7;
    margin-bottom: 25px;
}

button {
    background: gold;
    color: black;
    border: none;
    padding: 14px 24px;
    border-radius: 5px;
    font-weight: bold;
    cursor: pointer;
    margin: 5px;
}

button:hover {
    background: #e6b800;
}

section {
    padding: 55px 20px;
    text-align: center;
}

h2 {
    color: gold;
    margin-bottom: 25px;
}

.cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px;
    max-width: 1000px;
    margin: auto;
}

.card {
    background: #171717;
    border: 1px solid #725b16;
    padding: 30px 20px;
    border-radius: 10px;
}

.card h3 {
    color: gold;
    margin-bottom: 15px;
}

.card p {
    line-height: 1.6;
    margin-bottom: 15px;
}

.auth {
    background: #121212;
    max-width: 500px;
    margin: 30px auto;
    padding: 30px;
    border: 1px solid gold;
    border-radius: 10px;
}

input {
    width: 100%;
    padding: 14px;
    margin: 10px 0;
    background: #222;
    color: white;
    border: 1px solid #555;
    border-radius: 5px;
}

footer {
    background: #111;
    text-align: center;
    padding: 25px;
    color: gold;
}
</style>
</head>

<body>

<header>
    <div class="logo">👑 BILLIONAIRES EMPIRE</div>

    <nav>
        <a href="#home">Home</a>
        <a href="#marketplace">Marketplace</a>
        <a href="#creators">Creators</a>
        <a href="#login">Login</a>
    </nav>
</header>

<div class="hero" id="home">
    <h1>Welcome to Billionaires Empire</h1>
